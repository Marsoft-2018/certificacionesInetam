<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 250" width="220" height="250">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" style="stop-color:#1e5c0e"/>
      <stop offset="100%" style="stop-color:#0d2e06"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0d060"/>
      <stop offset="100%" style="stop-color:#c9a227"/>
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M20 20 L200 20 L200 160 Q200 220 110 240 Q20 220 20 160 Z"
        fill="url(#bg)" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Inner border -->
  <path d="M32 32 L188 32 L188 158 Q188 210 110 228 Q32 210 32 158 Z"
        fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.7"/>

  <!-- Top banner -->
  <rect x="20" y="20" width="180" height="26" rx="2" fill="#c9a227" opacity="0.9"/>
  <text x="110" y="38" text-anchor="middle" fill="#1a1a1a" font-family="serif" font-size="9" font-weight="bold">INSTITUCIÓN EDUCATIVA</text>

  <!-- Center emblem: tree/agropecuario symbol -->
  <circle cx="110" cy="110" r="45" fill="rgba(255,255,255,0.08)" stroke="url(#goldGrad)" stroke-width="1"/>
  <!-- Tree trunk -->
  <rect x="106" y="130" width="8" height="22" rx="2" fill="#d4af37"/>
  <!-- Tree canopy -->
  <ellipse cx="110" cy="112" rx="22" ry="18" fill="#2ecc71" opacity="0.85"/>
  <ellipse cx="95" cy="120" rx="15" ry="12" fill="#27ae60" opacity="0.75"/>
  <ellipse cx="125" cy="120" rx="15" ry="12" fill="#27ae60" opacity="0.75"/>
  <!-- Mining pick symbol -->
  <text x="110" y="168" text-anchor="middle" fill="#d4af37" font-family="serif" font-size="20">⛏</text>

  <!-- Bottom text -->
  <text x="110" y="195" text-anchor="middle" fill="#d4af37" font-family="serif" font-size="8" font-weight="bold">TÉCNICA AGROPECUARIA</text>
  <text x="110" y="207" text-anchor="middle" fill="#d4af37" font-family="serif" font-size="7.5">Y MINERA</text>
  <text x="110" y="220" text-anchor="middle" fill="#c9a227" font-family="serif" font-size="7">INETAM</text>

  <!-- Stars decoration -->
  <text x="46" y="115" text-anchor="middle" fill="#d4af37" font-size="10">★</text>
  <text x="174" y="115" text-anchor="middle" fill="#d4af37" font-size="10">★</text>
</svg>
